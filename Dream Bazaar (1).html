:root{--bg:#000;--card:#0e0a0b;--wine:#64081B;--gold:#FFC042;--ink:#f7f1ea;--mute:#a99a98;--line:rgba(255,192,66,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden;width:100%}
body{background:radial-gradient(ellipse at 50% -5%,rgba(100,8,27,.75),transparent 60%),var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;line-height:1.7;min-height:100vh;padding-bottom:calc(98px + env(safe-area-inset-bottom,0px));overflow-x:hidden;width:100%;max-width:100%;position:relative}
html[lang=en] body{font-family:"Space Grotesk",system-ui,sans-serif}
.wrap{width:100%;max-width:480px;margin:0 auto;padding:14px 18px;overflow-x:clip}
.lang{display:flex;justify-content:center;gap:4px;width:max-content;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px}
.lang button{border:0;background:none;color:var(--mute);font:inherit;font-size:13px;padding:3px 14px;border-radius:99px;cursor:pointer}
.lang button.on{background:var(--gold);color:#000;font-weight:700}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{text-align:center;padding:22px 0 6px}
.ring{position:relative;width:176px;height:176px;margin:0 auto;border-radius:50%;padding:5px;background:conic-gradient(var(--gold),var(--wine),#ff7a59,var(--gold));animation:spin 8s linear infinite}
.in{position:relative;width:100%;height:100%;border-radius:50%;background:#000;padding:4px;animation:spin 8s linear infinite reverse}
.in img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--card)}
.badgebox{position:absolute;inset:0;animation:spin 8s linear infinite reverse}
.badge{position:absolute;inset-inline-end:2px;bottom:2px;width:46px;height:46px;border-radius:50%;background:var(--gold);border:4px solid #000;display:grid;place-items:center}
.badge svg{width:22px;fill:none;stroke:#000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:26px;font-weight:800;margin-top:16px;font-family:"Space Grotesk","Vazirmatn",sans-serif}
.role{color:var(--gold);font-weight:600;font-size:15px}
.bio{color:var(--mute);font-size:14px;margin:10px auto 0;max-width:36ch}
.phones{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;width:100%;gap:8px;margin-top:14px;text-align:center}
.ph{display:inline-flex;align-items:center;gap:8px;direction:ltr;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;padding:7px 16px;border-radius:99px;transition:.2s}
.ph:hover{border-color:var(--gold);transform:translateY(-2px)}
.ph svg{width:16px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.soc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 6px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-4px);border-color:var(--gold)}
.tile:active{transform:scale(.97)}
.ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.ic svg{width:23px;height:23px;fill:#fff}
.ic svg.st{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ghost{width:30px!important;height:30px!important;fill:#fff!important;stroke:#000;stroke-width:1.4;stroke-linejoin:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px) rotate(-4deg)}}
h2{font-size:17px;margin:30px 0 12px;font-weight:800}
.addr{position:relative;display:flex;align-items:center;gap:14px;overflow:hidden;width:100%;margin-top:16px;padding:16px;border-radius:20px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:linear-gradient(rgba(255,192,66,.07) 1px,transparent 1px) 0 0/100% 22px,linear-gradient(90deg,rgba(255,192,66,.07) 1px,transparent 1px) 0 0/22px 100%,var(--card);transition:border-color .2s}
.addr:hover{border-color:var(--gold)}
.pin{position:relative;width:52px;height:52px;flex:none;border-radius:14px;background:var(--gold);display:grid;place-items:center;font-size:24px}
.pin::after{content:"";position:absolute;inset:0;border-radius:14px;border:2px solid var(--gold);animation:ping 2s ease-out infinite}
@keyframes ping{to{transform:scale(1.7);opacity:0}}
.addr .tx{flex:1;min-width:0}
.addr small{display:block;color:var(--gold);font-size:12px;font-weight:600}
.addr b{display:block;font-size:15px;font-weight:800}
.addr em{font-style:normal;color:var(--mute);font-size:12px}
.arr{width:20px;flex:none;fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
[dir=ltr] .arr{transform:scaleX(-1)}
.works{display:grid;gap:10px}
.wk{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:16px;padding:12px 14px;color:var(--ink);text-decoration:none;transition:transform .2s,border-color .2s}
.wk:hover{transform:translateY(-3px);border-color:var(--gold)}
.wk .sq{width:48px;height:48px;flex:none;border-radius:13px;background:var(--gold);display:grid;place-items:center}
.wk .sq svg,.cardsv svg{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wk .sq svg{width:24px;stroke:#000;stroke-width:1.9}
.wk .tx{flex:1}
.wk .sq svg.br{width:48px;height:48px;stroke:none;fill:none;border-radius:13px}
.wk b{display:block;font-size:15px;font-family:"Space Grotesk","Vazirmatn",sans-serif}
.wk span{font-size:12px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cardsv{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px 18px;transition:transform .2s}
.cardsv:hover{transform:translateY(-4px)}
.cardsv::before{content:"";position:absolute;width:90px;height:90px;border-radius:50%;top:-30px;inset-inline-end:-30px;background:var(--c);opacity:.18;filter:blur(14px)}
.cardsv .o{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 6px 16px color-mix(in srgb,var(--c) 40%,transparent)}
.cardsv svg{width:25px;stroke:#fff;stroke-width:1.8}
.cardsv b{display:block;font-size:14px;margin-top:10px}
.cardsv span{display:block;font-size:12px;color:var(--mute);line-height:1.5}
.cardsv i{display:block;width:30px;height:3px;border-radius:3px;background:var(--c);margin-top:10px}
.cta-bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000 40%)}
.cta{display:flex;justify-content:center;align-items:center;gap:10px;max-width:480px;margin:0 auto;background:var(--gold);color:#000;font-weight:800;text-decoration:none;border-radius:18px;padding:15px;box-shadow:0 8px 24px rgba(255,192,66,.3);animation:pulse 2.6s ease-in-out infinite}
.cta svg{width:22px;fill:#000}
@keyframes pulse{50%{transform:scale(1.02)}}
.fade{opacity:0;transform:translateY(12px);animation:up .5s ease forwards}
@keyframes up{to{opacity:1;transform:none}}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:26px}
@media(max-width:340px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fade{opacity:1;transform:none}}
</style>
</head>

  $("name").textContent=t.name;$("role").textContent=t.role;$("bio").textContent=t.bio;document.title=t.name;

  const socials=[["ig",CONFIG.instagram,t.ig],["wa",wa,t.wa],["sn",CONFIG.snapchat,t.sn],["tt",CONFIG.tiktok,t.tt],["pn",CONFIG.pinterest,t.pn],["web",CONFIG.website,t.web]];
  $("soc").innerHTML=socials.map(([k,u,l],i)=>`<a class="tile fade" data-k="${k}" style="animation-delay:${.05+i*.06}s" href="${u}" target="_blank" rel="noopener"><span class="ic" style="background:${SOC[k][0]}"><svg viewBox="0 0 24 24">${SOC[k][1]}</svg></span>${l}</a>`).join("");
  $("addr").href=CONFIG.mapLink;
  $("addr").innerHTML=`<span class="pin">📍</span><span class="tx"><small>${t.addrH}</small><b>${t.addrT}</b><em>${t.map}</em></span><svg class="arr" viewBox="0 0 24 24">${P.arrow}</svg>`;
  $("wT").textContent=t.wT;
  $("works").innerHTML=CONFIG.works.map(([s,u],i)=>`<a class="wk fade" style="animation-delay:${.1+i*.06}s" href="${u}" target="_blank" rel="noopener"><span class="sq" style="background:none">${BR[i]}</span><span class="tx"><b>${s}</b><span>${t.wReq}</span></span><svg class="arr" viewBox="0 0 24 24">${P.arrow}</svg></a>`).join("");
  $("sT").textContent=t.sT;
  $("svc").innerHTML=t.sv.map((s,i)=>`<div class="cardsv fade" style="--c:${svColors[i]};animation-delay:${.1+i*.06}s"><span class="o"><svg viewBox="0 0 24 24">${P[svIcons[i]]}</svg></span><b>${s[0]}</b><span>${s[1]}</span><i></i></div>`).join("");
  $("cta").href=wa;$("ctaT").textContent=t.cta;$("foot").textContent=t.foot;
  $("lang").innerHTML=[["ku","کوردی"],["ar","عربي"],["en","EN"]].map(([c,l])=>`<button class="${c===lang?"on":""}" data-l="${c}">${l}</button>`).join("");
}
$("lang").addEventListener("click",e=>{const l=e.target.dataset.l;if(!l)return;lang=l;try{localStorage.setItem("db_lang",l)}catch(x){}render()});
$("soc").addEventListener("click",e=>{const a=e.target.closest('a[data-k="sn"]');if(!a)return;const ua=navigator.userAgent,web=CONFIG.snapchat,u=CONFIG.snapUser;if(/Android/i.test(ua)){e.preventDefault();location.href="intent://add/"+u+"#Intent;package=com.snapchat.android;scheme=snapchat;S.browser_fallback_url="+encodeURIComponent(web)+";end"}else if(/iPhone|iPad|iPod/i.test(ua)){e.preventDefault();const t=Date.now();location.href="snapchat://add/"+u;setTimeout(()=>{if(!document.hidden&&Date.now()-t<2500)location.href=web},1200)}});
photo();render();
</script>
</body>
